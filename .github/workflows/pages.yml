name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "internal/cli/**"
      - "scripts/build-site.sh"
      - "scripts/stamp-assets.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy acurl.dev
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Regenerate the command reference
        run: scripts/build-site.sh
      - name: Version the stylesheet and script links
        run: scripts/stamp-assets.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
