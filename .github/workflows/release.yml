name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]   # not the moving v1 tag used by the Action

permissions:
  contents: write    # GitHub release
  packages: write    # ghcr.io images
  id-token: write    # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  npm:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish @tragent/acurl
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set, skipping"; exit 0; fi
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}" --allow-same-version
          npm publish --access public --provenance

  pypi:
    needs: release
    runs-on: ubuntu-latest
    # Enable after configuring PyPI trusted publishing: set the repository
    # variable PUBLISH_PYPI to "true".
    if: ${{ !contains(github.ref_name, '-') && vars.PUBLISH_PYPI == 'true' }}
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        working-directory: packaging/python
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$v\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$v\"/" src/acurl_cli/__init__.py
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packaging/python/dist
