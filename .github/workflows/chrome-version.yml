name: Chrome baseline freshness

on:
  schedule:
    - cron: "0 6 1 * *"   # monthly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: scripts/check-chrome-version.sh | tee result.txt
        continue-on-error: true
      - name: Open an issue when the profile is stale
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Chrome baseline profile is behind stable Chrome"
          if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body "$(cat result.txt)"
          fi
