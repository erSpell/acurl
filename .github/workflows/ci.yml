name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: go tool cover -func=coverage.out | tail -1

  render:
    name: Headless render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Allow Chrome's sandbox
        # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's
        # sandbox needs; re-enable them rather than disabling the sandbox.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test with Chrome
        env:
          ACURL_TEST_RENDER: "1"
        run: go test -run 'TestHeadless' -v ./internal/render/

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - id: acurl
        uses: ./
        with:
          version: source
          urls: https://example.com
          categories: ai-assistant
          fail-on: none
          upload-sarif: "false"
      - name: Check outputs
        run: |
          test -s "${{ steps.acurl.outputs.report }}"
          echo "score=${{ steps.acurl.outputs.score }}"

  wrappers:
    name: npm and pip wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: packaging/npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests
        working-directory: packaging/python

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.1
          # Build the linter with the job's Go so it understands go 1.26 modules.
          install-mode: goinstall
          # The config is checked locally with "golangci-lint config verify";
          # skip it here so CI does not depend on fetching the remote schema.
          verify: false

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/acurl
